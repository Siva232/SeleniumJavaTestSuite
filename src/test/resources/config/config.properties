# =====================================================================
# DemoProject framework configuration
# Precedence for every key:  -Dkey=value  >  <env>.key  >  key
# ENC(...) values are AES-GCM encrypted; the key is read from the
# DEMO_SECRET_KEY environment variable (never commit it).
# =====================================================================

# ---- Environment: QA / UAT / PROD -----------------------------------
env=QA

# ---- Web application ------------------------------------------------
app.url=https://rahulshettyacademy.com/AutomationPractice/
app.login.url=https://rahulshettyacademy.com/loginpagePractise/
app.username=rahulshettyacademy
app.password=ENC(T9j4w9e92I7AMGL6K88+PhFLB6ZktCPJghq+GqFU6S4RzwWprgads0DqIX/1)

# ---- REST API -------------------------------------------------------
api.base.url=https://jsonplaceholder.typicode.com
api.timeout.seconds=30
# Optional bearer token, e.g. api.auth.token=ENC(...)
api.auth.token=

# ---- MySQL ----------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/demoproject
db.username=root
db.password=ENC(7YOORiIJxjRibedMhXTLv6wfM0+QXwrk0MlsfxnfehQ=)
db.timeout.seconds=30

# ---- Browser --------------------------------------------------------
# chrome / firefox / edge
browser=chrome
headless=false
explicit.timeout.seconds=20
page.load.timeout.seconds=60

# ---- Execution ------------------------------------------------------
parallel.thread.count=4
# Extra attempts for a failed scenario; 0 disables retry
rerun.count=2

# ---- Evidence -------------------------------------------------------
# FAILED / ALL / NONE
screenshot.mode=FAILED
# FAILED / ALL / NONE  (recordings of non-matching scenarios are deleted)
video.recording=FAILED
video.frame.interval.ms=500
video.max.width=1280

# ---- Reporting & logging --------------------------------------------
report.dir=reports
report.history.count=10
log.level=INFO

# =====================================================================
# Environment overrides
# =====================================================================
QA.app.url=https://rahulshettyacademy.com/AutomationPractice/
QA.api.base.url=https://jsonplaceholder.typicode.com
QA.db.url=jdbc:mysql://localhost:3306/demoproject

# UAT runs headless with a single retry against the UAT database.
